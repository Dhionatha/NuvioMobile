name: Upstream Sync

on:
  schedule:
    - cron: "23 6 * * *" # daily at 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/cmp-rewrite into stable
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.version }}
      needs_release: ${{ steps.version.outputs.needs_release }}
    steps:
      - name: Check out stable
        uses: actions/checkout@v6
        with:
          ref: stable
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: ./scripts/upstream-sync.sh

      - name: Detect release for the current upstream version
        id: version
        env:
          TAG_SUFFIX: "-custom.1"
          LEGACY_TAG_SUFFIXES: "-fork.1"
        run: |
          version="$(
            sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' \
              iosApp/Configuration/Version.xcconfig \
              | head -n 1
          )"
          if [[ -z "${version}" ]]; then
            echo "Could not read MARKETING_VERSION." >&2
            exit 1
          fi

          git fetch --tags origin
          existing_tags="$(
            {
              git tag --list "${version}${TAG_SUFFIX}-*"
              for legacy_suffix in ${LEGACY_TAG_SUFFIXES}; do
                git tag --list "${version}${legacy_suffix}-*"
              done
            } | sort -u
          )"
          if [[ -n "${existing_tags}" ]]; then
            echo "A release already exists for ${version}:" >&2
            echo "${existing_tags}" >&2
            needs_release=false
          else
            needs_release=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "needs_release=${needs_release}" >> "${GITHUB_OUTPUT}"

  release:
    name: Release ${{ needs.sync.outputs.release_version }} for Nuvio Custom
    needs: sync
    if: needs.sync.outputs.needs_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      mode: publish
      tag_suffix: "-custom.1"
      enforce_bump_final: false
      build_ios: false
      update_store: false
    secrets: inherit
